<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doanh thu theo SDT khách</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --line:#e3e6eb; --fg:#1b1f29; --muted:#6a7285; --accent:#2f5bea; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  main { height:100vh; display:flex; flex-direction:column; padding:16px 20px; }   /* full màn hình, không giới hạn chiều rộng */
  .top { display:flex; align-items:baseline; gap:16px; margin:0 0 12px; }
  h1 { font-size:20px; margin:0; }
  .back { font-size:13px; color:var(--accent); text-decoration:none; white-space:nowrap; }
  .back:hover { text-decoration:underline; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; background:var(--card);
         border:1px solid var(--line); border-radius:10px; padding:14px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, select, button { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--fg); }
  select { min-width:220px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #msg { margin:10px 2px; font-size:13px; color:var(--muted); min-height:18px; }
  #msg.warn { color:#b45309; }
  .wrap { flex:1; min-height:0; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:separate; border-spacing:0; width:100%; }
  th, td { padding:8px 12px; font-size:13px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:#f1f3f7; z-index:2; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; }
  /* Dòng tổng cố định ở đáy khung bảng */
  tfoot td { position:sticky; bottom:0; z-index:2; background:#e8eefc; font-weight:700; border-top:2px solid var(--accent); border-bottom:0; }
  tfoot td.warn { background:#fef3c7; }
</style>
</head>
<body>
<main>
  <div class="top"><a class="back" href="index.html">&larr; Trang chủ</a><h1>Doanh thu theo SDT khách</h1></div>
  <div class="bar">
    <label>Số điện thoại<input type="tel" id="phone" inputmode="numeric" autocomplete="off" placeholder="VD: 0901234567" maxlength="15"></label>
    <label>Từ ngày<input type="date" id="fromDate"></label>
    <label>Đến ngày<input type="date" id="toDate"></label>
    <button id="btn" class="primary">Tìm</button>
    <button id="dl" disabled>Download CSV</button>
  </div>
  <div id="msg"></div>
  <div class="wrap" id="wrap" hidden><table id="tbl"></table></div>
</main>

<script>
// >>> Đổi thành domain API của bạn (không có dấu / ở cuối)
const API = 'https://report-api.orderpermillion.trade';
const MAX_DAYS = 31;   // phải khớp MAX_DAYS_SDT của API

const $ = id => document.getElementById(id);
let rows = [], totalsAll = {}, totalCount = 0, lastTruncated = false;

const LABELS = {
  Ten_KH: 'Tên KH', SDT: 'SDT', Ten_nha_hang: 'Chi nhánh', Ngay: 'Ngày', Khu: 'Khu', So_phieu: 'Số phiếu',
  Vi_tri: 'Vị trí', SL_khach: 'SL khách', Thoi_gian_dong_phieu: 'TG đóng phiếu', Tien_hang: 'Tiền hàng',
  Phi_DV: '% Phí dv', Tien_phi_DV: 'Tiền phí dv', Giam_chi_tiet: 'Giảm mặt hàng', Giam_phieu: 'Giảm phiếu',
  Tong_giam: 'Giảm giá', Tien_truoc_thue: 'Tiền trước thuế', TTDB: 'TTĐB', Thue_VAT: 'Thuế VAT',
  Tong_sau_thue: 'Tổng sau thuế', Phi_giao_hang: 'Phí giao hàng', Thuc_tra: 'Thực trả', Gio_vao: 'Giờ vào', Ghi_chu: 'Ghi chú'
};
const label = c => LABELS[c] || c;
const TIME_COLS = /^(Gio_vao|Thoi_gian_dong_phieu)$/;
// Thời gian/ngày trả về dạng ISO; hiển thị nguyên giá trị trong DB (không đổi múi giờ)
const fmtVal = (k, v) => {
  if (v === null || v === undefined) return '';
  if (TIME_COLS.test(k)) return String(v).replace('T', ' ').slice(0, 19);
  if (k === 'Ngay') return String(v).slice(0, 10);
  return v;
};
const fmtNum = v => (typeof v === 'number') ? v.toLocaleString('vi-VN', { maximumFractionDigits: 3 }) : v;
// Các cột được cộng tổng (không cộng % Phí dv và Khu)
const SUM_COLS = ['SL_khach','Tien_hang','Tien_phi_DV','Giam_chi_tiet','Giam_phieu','Tong_giam',
                  'Tien_truoc_thue','TTDB','Thue_VAT','Tong_sau_thue','Phi_giao_hang','Thuc_tra'];
const setMsg = (t, warn) => { $('msg').textContent = t; $('msg').className = warn ? 'warn' : ''; };
const cleanPhone = () => $('phone').value.replace(/[\s.\-]/g, '');

const today = new Date().toISOString().slice(0, 10);
$('fromDate').value = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
$('toDate').value = today;
$('phone').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });

$('btn').onclick = async () => {
  const phone = cleanPhone(), from = $('fromDate').value, to = $('toDate').value;
  if (!/^\d{8,15}$/.test(phone)) return setMsg('Hãy nhập số điện thoại hợp lệ (chỉ gồm chữ số)', true);
  if (!from || !to) return setMsg('Hãy chọn Từ ngày và Đến ngày', true);
  if (from > to) return setMsg('Từ ngày phải nhỏ hơn hoặc bằng Đến ngày', true);
  const days = (Date.parse(to) - Date.parse(from)) / 864e5 + 1;
  if (days > MAX_DAYS) return setMsg(`Chỉ được tìm tối đa ${MAX_DAYS} ngày mỗi lần`, true);

  setMsg('Đang tìm...');
  $('btn').disabled = true; $('dl').disabled = true;
  let data;
  try {
    const r = await fetch(`${API}/api/revenue-by-phone?phone=${encodeURIComponent(phone)}&fromDate=${from}&toDate=${to}`);
    if (r.status === 429) throw new Error('Bạn thao tác quá nhanh, thử lại sau ít phút');
    if (r.status === 400) throw new Error((await r.json()).error || 'Tham số không hợp lệ');
    if (!r.ok) throw new Error('Lỗi khi truy vấn, thử lại sau');
    data = await r.json();
  } catch (e) {
    setMsg(e.message, true); $('btn').disabled = false; return;
  }
  $('btn').disabled = false;

  rows = data.rows; totalsAll = data.totals; totalCount = data.total; lastTruncated = !!data.truncated;
  const tbl = $('tbl'); tbl.replaceChildren();
  $('wrap').hidden = !rows.length;
  if (!rows.length) return setMsg('Không có dữ liệu');
  const cols = Object.keys(rows[0]);

  const thead = tbl.createTHead().insertRow();
  cols.forEach(c => { const th = document.createElement('th'); th.textContent = label(c); thead.appendChild(th); });

  const tbody = tbl.createTBody();
  rows.forEach(row => {
    const tr = tbody.insertRow();
    cols.forEach(c => {
      const td = tr.insertCell();
      td.textContent = fmtNum(fmtVal(c, row[c]));       // textContent: chống XSS
      if (typeof row[c] === 'number') td.className = 'num';
    });
  });

  // Dòng tổng cố định (tfoot sticky) — số liệu do API tính trên TOÀN BỘ kết quả, không phụ thuộc số dòng đang hiển thị
  const foot = tbl.createTFoot().insertRow();
  cols.forEach((c, i) => {
    const td = foot.insertCell();
    if (i === 0) td.textContent = `TỔNG (${totalCount.toLocaleString('vi-VN')} phiếu)`;
    else if (SUM_COLS.includes(c)) { td.textContent = fmtNum(totalsAll[c]); td.className = 'num'; }
  });

  if (lastTruncated) {
    setMsg(`Tổng ${totalCount.toLocaleString('vi-VN')} dòng. Chỉ hiển thị ${data.limit.toLocaleString('vi-VN')} dòng đầu; dòng TỔNG vẫn tính trên toàn bộ ${totalCount.toLocaleString('vi-VN')} dòng.`, true);
  } else {
    setMsg(`Tổng ${totalCount.toLocaleString('vi-VN')} dòng`);
  }
  $('dl').disabled = false;
};

$('dl').onclick = () => {
  const cols = Object.keys(rows[0]);
  const esc = v => {
    let s = String(v ?? '');
    if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s;   // chống CSV injection (không đụng tới số âm)
    return `"${s.replace(/"/g, '""')}"`;
  };
  const totalRow = cols.map((c, i) =>
    i === 0 ? `TỔNG (${totalCount} phiếu${lastTruncated ? `; file chỉ có ${rows.length} dòng đầu` : ''})`
            : (SUM_COLS.includes(c) ? totalsAll[c] : ''));
  const csv = [cols.map(c => esc(label(c))).join(','),
               ...rows.map(r => cols.map(c => esc(fmtVal(c, r[c]))).join(',')),
               totalRow.map(esc).join(',')].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }));  // BOM để Excel đọc đúng tiếng Việt
  a.download = `doanhthu_sdt_${$('fromDate').value}_${$('toDate').value}.csv`;   // không đưa SĐT vào tên file
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
</script>
</body>
</html>
