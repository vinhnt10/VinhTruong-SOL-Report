<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo cáo SOL</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --line:#e3e6eb; --fg:#1b1f29; --muted:#6a7285; --accent:#2f5bea; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1100px; margin:0 auto; padding:32px 20px 56px; }
  .back { font-size:13px; color:var(--accent); text-decoration:none; }
  .back:hover { text-decoration:underline; }
  h1 { font-size:24px; margin:12px 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; }
  .btn { display:flex; flex-direction:column; gap:6px; padding:20px; min-height:112px; background:var(--card);
         border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none;
         transition:border-color .15s, box-shadow .15s, transform .15s; }
  a.btn:hover, a.btn:focus-visible { border-color:var(--accent); box-shadow:0 4px 16px rgba(47,91,234,.14); transform:translateY(-1px); outline:none; }
  .btn .name { font-size:16px; font-weight:600; }
  .btn .desc { font-size:13px; color:var(--muted); line-height:1.4; }
  .btn .tag { margin-top:auto; font-size:12px; color:var(--accent); font-weight:600; }
  .btn.off { background:#f1f3f7; cursor:not-allowed; }
  .btn.off .name, .btn.off .tag { color:var(--muted); }
  .empty { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Trang chủ</a>
  <h1 id="title">Báo cáo</h1>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<script src="depts.js"></script>
<script>
const id = new URLSearchParams(location.search).get('d');
const dept = DEPTS.find(d => d.id === id);
if (!dept) {
  document.getElementById('title').textContent = 'Không tìm thấy phòng ban';
  document.getElementById('empty').textContent = 'Hãy quay lại trang chủ và chọn phòng ban.';
  document.getElementById('empty').hidden = false;
} else {
  document.title = dept.name + ' | Báo cáo SOL';
  document.getElementById('title').textContent = dept.name;
  const grid = document.getElementById('grid');
  if (!dept.pages.length) {
    document.getElementById('empty').textContent = 'Phòng ban này chưa có báo cáo nào.';
    document.getElementById('empty').hidden = false;
  } else {
    document.getElementById('sub').textContent = 'Chọn một báo cáo để xem chi tiết.';
  }
  for (const p of dept.pages) {
    const el = document.createElement(p.href ? 'a' : 'div');
    el.className = 'btn' + (p.href ? '' : ' off');
    if (p.href) el.href = p.href;
    for (const [cls, txt] of [['name', p.name], ['desc', p.desc], ['tag', p.href ? 'Mở báo cáo →' : 'Sắp có']]) {
      const s = document.createElement('span'); s.className = cls; s.textContent = txt; el.appendChild(s);
    }
    grid.appendChild(el);
  }
}
</script>
</body>
</html>
