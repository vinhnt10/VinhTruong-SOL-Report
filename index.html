<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinh Trương support bà con các phòng ban SOL hết mình</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --line:#e3e6eb; --fg:#1b1f29; --muted:#6a7285; --accent:#2f5bea; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1280px; margin:0 auto; padding:40px 20px 56px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 28px; }
  /* 10 nút chia đều: 5 cột x 2 hàng; màn hình hẹp thì giảm số cột */
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; }
  @media (max-width: 1000px) { .grid { grid-template-columns:repeat(3, 1fr); } }
  @media (max-width: 640px)  { .grid { grid-template-columns:repeat(2, 1fr); } }
  .btn { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; padding:20px 12px; min-height:128px;
         background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; text-align:center;
         transition:border-color .15s, box-shadow .15s, transform .15s; }
  .btn:hover, .btn:focus-visible { border-color:var(--accent); box-shadow:0 4px 16px rgba(47,91,234,.14); transform:translateY(-1px); outline:none; }
  .btn .name { font-size:18px; font-weight:600; }
  .btn .count { font-size:12px; color:var(--accent); font-weight:600; }
  .btn.empty .count { color:var(--muted); font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>Trang báo cáo support cho nhà SOL của Vinh Trương 2027</h1>
  <p class="sub">Chọn phòng ban để xem các báo cáo.</p>
  <div class="grid" id="grid"></div>
</main>

<script src="depts.js"></script>
<script src="auth.js"></script>
<script>
const grid = document.getElementById('grid');
for (const d of DEPTS) {
  const a = document.createElement('a');
  const n = d.pages.filter(p => p.href).length;     // chỉ đếm báo cáo đã mở được
  a.className = 'btn' + (n ? '' : ' empty');
  const url = d.href || 'phong-ban.html?d=' + encodeURIComponent(d.id);
  a.href = url;
  a.addEventListener('click', e => { e.preventDefault(); SOLAuth.enter(d.id, url); });   // kiểm tra mã user trước khi vào
  for (const [cls, txt] of [['name', d.name], ['count', n ? n + ' báo cáo' : 'Chưa có báo cáo']]) {
    const s = document.createElement('span'); s.className = cls; s.textContent = txt; a.appendChild(s);
  }
  grid.appendChild(a);
}
// Bị chặn khi vào thẳng URL: hỏi mã luôn
const need = new URLSearchParams(location.search).get('need');
if (need && DEPTS.some(d => d.id === need)) {
  const d = DEPTS.find(x => x.id === need);
  history.replaceState(null, '', 'index.html');
  SOLAuth.enter(need, d.href || 'phong-ban.html?d=' + encodeURIComponent(need));
}
</script>
</body>
</html>
